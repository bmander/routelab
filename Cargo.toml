[workspace]
members = ["crates/routelab-core", "crates/routelab-py"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/bmander/routelab"
rust-version = "1.83"

[workspace.dependencies]
routelab-core = { path = "crates/routelab-core" }

[profile.release]
lto = "thin"
codegen-units = 1
