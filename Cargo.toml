[workspace]
members = [
    "crates/routelab-core",
    "crates/routelab-gtfs",
    "crates/routelab-osm",
    "crates/routelab-py",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/bmander/routelab"
rust-version = "1.83"

[workspace.dependencies]
routelab-core = { path = "crates/routelab-core" }
routelab-gtfs = { path = "crates/routelab-gtfs" }
routelab-osm = { path = "crates/routelab-osm" }

[profile.release]
lto = "thin"
codegen-units = 1

# Release, but symbolicated, so a sampling profiler can name what it caught.
[profile.profiling]
inherits = "release"
debug = true
