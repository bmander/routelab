[package]
name = "routelab-py"
description = "Python bindings for routelab-core."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "_routelab"
crate-type = ["cdylib", "rlib"]

[features]
# Off by default so `cargo test` can link against libpython; maturin turns it on.
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.29" }
routelab-core.workspace = true
