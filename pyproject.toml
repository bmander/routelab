[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "routelab"
description = "Reference implementations of routing algorithms: Python veneer, Rust kernels."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=7", "maturin>=1.7,<2.0", "pyright>=1.1.390"]

[project.urls]
Repository = "https://github.com/bmander/routelab"

[tool.maturin]
manifest-path = "crates/routelab-py/Cargo.toml"
module-name = "routelab._routelab"
python-source = "python"
features = ["extension-module"]

[tool.pytest.ini_options]
# Docstring examples are run as tests, so the documentation cannot drift.
# The paper pages under docs/ are collected the same way, for the same reason:
# a hello-world that no longer runs is worse than no hello-world.
testpaths = ["tests", "python/routelab"]
# tests/ on the path so nested test files keep reaching conftest's helpers
# by name. Do not add __init__.py under tests/, and do not add a conftest.py
# anywhere else — a second conftest module would then shadow this one, which
# is why the pages under docs/ are run by tests/test_docs.py rather than by
# pointing --doctest-glob at them.
pythonpath = ["tests"]
addopts = "--doctest-modules"

[tool.pyright]
# The veneer's whole contract is its signatures: a query option a technique
# does not take should be an error a caller sees before running anything,
# which is only true if this is what CI checks — so CI runs it. 3.9 because
# that is the floor the package declares and the lower half of the test matrix.
#
# The library only, for now. The callers under tests/, demos/ and benchmarks/
# are what actually pass query options, so checking them would catch more —
# but they are written loosely on purpose in places (a test that hands a
# planner the wrong thing to watch it refuse), and sorting that out is its own
# piece of work rather than a condition of this one.
include = ["python"]
pythonVersion = "3.9"
