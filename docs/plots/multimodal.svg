<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="Multimodal: what preprocessing buys. Seattle's pavements + King County Metro — 560,706 nodes, 10 random pavement-to-pavement trips">
<title>Multimodal: what preprocessing buys</title>
<style>
  .surface { fill: #fdfdfc; }
  .title { font: 600 15px system-ui, sans-serif; fill: #1a1a18; }
  .subtitle { font: 12px system-ui, sans-serif; fill: #6a6a64; }
  .tick { font: 11px system-ui, sans-serif; fill: #6a6a64; }
  .axis { font: 11px system-ui, sans-serif; fill: #6a6a64; }
  .label { font: 12px system-ui, sans-serif; fill: #1a1a18; }
  .grid { stroke: #e2e1dc; stroke-width: 1; }
  .break { stroke: #e2e1dc; stroke-width: 1.5; fill: none; }
  .dot { fill: #2a78d6; stroke: #fdfdfc; stroke-width: 2; }
  .end { text-anchor: end; }
  .mid { text-anchor: middle; }
  .start { text-anchor: start; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #16171a; }
    .title { fill: #e6e5e0; }
    .subtitle, .tick, .axis { fill: #9a998f; }
    .label { fill: #e6e5e0; }
    .grid, .break { stroke: #2c2e33; }
    .dot { fill: #3987e5; stroke: #16171a; }
  }
</style>
